[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-cursor-login"
version = "0.1.0"
description = "Secure Cursor subscription login and model provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kaan Kutluk"}]
keywords = ["hermes-agent", "cursor", "oauth", "model-provider", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["h2==4.3.0", "protobuf==6.33.5"]

[project.optional-dependencies]
test = ["openai>=1", "pytest>=8", "ruff==0.16.4"]
release = ["build>=1.2", "twine>=6"]

[project.scripts]
hermes-cursor-login = "hermes_cursor_login.cli:main"

[project.urls]
Repository = "https://github.com/IsrafilEMIN/hermes-cursor-login"
Issues = "https://github.com/IsrafilEMIN/hermes-cursor-login/issues"

[tool.hatch.build.targets.wheel]
packages = ["hermes_cursor_login"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
exclude = ["hermes_cursor_login/native/proto/agent_pb2.py"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["FLY002"]
"hermes_cursor_login/bridge.py" = ["BLE001"]
